<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logic Test</title>
  <style>
    :root {
      --bg: #0f1116;
      --panel: #171a22;
      --panel-border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #6abf69;
      --danger: #e06c75;
      --line: #7aa2f7;
      --ghost: rgba(230, 233, 239, 0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.02);
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .container {
      padding: 16px 20px 24px;
      display: grid;
      gap: 16px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
      font-size: 13px;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cases {
      display: grid;
      gap: 16px;
    }
    .case {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .case-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .case-title {
      font-size: 14px;
      margin: 0;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .badge.pass {
      background: rgba(106, 191, 105, 0.2);
      color: var(--accent);
      border: 1px solid rgba(106, 191, 105, 0.4);
    }
    .badge.fail {
      background: rgba(224, 108, 117, 0.2);
      color: var(--danger);
      border: 1px solid rgba(224, 108, 117, 0.4);
    }
    .meta {
      font-size: 11px;
      color: var(--muted);
    }
    svg {
      width: 100%;
      height: 150px;
      border-radius: 8px;
      background: #0b0f15;
      border: 1px solid var(--panel-border);
    }
  </style>
</head>
<body>
  <header>
    <h1>Logic Test</h1>
    <p>Visual check for segment splitting with overlaps and intersections.</p>
  </header>

  <main class="container">
    <section class="controls">
      <label><input id="toggleOriginal" type="checkbox" checked />Show original segments</label>
      <label><input id="toggleSplit" type="checkbox" checked />Show split segments</label>
      <label><input id="toggleExpected" type="checkbox" checked />Show expected points</label>
      <label><input id="toggleEndpoints" type="checkbox" />Show split endpoints</label>
    </section>
    <section id="cases" class="cases"></section>

    <section class="controls" style="flex-direction: column; align-items: stretch; gap: 8px;">
      <h2 style="margin: 0; font-size: 16px;">点列化の新旧比較（サンプリング方式）</h2>
      <p style="margin: 0; color: var(--muted); font-size: 13px;">
        実際の SVG を選ぶと、旧方式（getPointAtLength で等間隔サンプリング）と
        新方式（<code>d</code> 属性を直接解釈し曲線だけ適応分割）を同じ入力に掛け、
        <strong>形状のずれ・点数・所要時間</strong>を突き合わせます。ずれは双方向の
        最大距離（片方の各点から他方の折れ線までの距離の最大）で、単位は地図単位。
      </p>
      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <input id="cmpFile" type="file" accept="image/svg+xml" />
        <label>間引き間隔 <input id="cmpStep" type="number" value="1.2" step="0.2" min="0.2" style="width: 70px;" /></label>
        <label>曲線許容差 <input id="cmpTol" type="number" value="0.05" step="0.01" min="0.001" style="width: 70px;" /></label>
        <button id="cmpRun" type="button">比較する</button>
      </div>
      <pre id="cmpOut" style="margin: 0; padding: 12px; background: #0b0f15; border: 1px solid var(--panel-border); border-radius: 8px; overflow: auto; max-height: 420px; font-size: 12px; line-height: 1.5;">SVG を選んで「比較する」を押してください。</pre>
    </section>
  </main>

  <svg id="measure" width="0" height="0" style="position:absolute; left:-9999px; top:-9999px;"></svg>

  <script src="logic.js"></script>
  <script>
    const cases = [
      {
        id: "cross",
        label: "Crossing (X)",
        segments: [
          { a: { x: 10, y: 10 }, b: { x: 110, y: 110 }, source: "test" },
          { a: { x: 10, y: 110 }, b: { x: 110, y: 10 }, source: "test" },
        ],
        expected: [{ x: 60, y: 60 }],
      },
      {
        id: "tee",
        label: "T junction",
        segments: [
          { a: { x: 10, y: 60 }, b: { x: 110, y: 60 }, source: "test" },
          { a: { x: 60, y: 10 }, b: { x: 60, y: 60 }, source: "test" },
        ],
        expected: [{ x: 60, y: 60 }],
      },
      {
        id: "near-tee",
        label: "Near T junction (snap)",
        segments: [
          { a: { x: 10, y: 60 }, b: { x: 110, y: 60 }, source: "test" },
          { a: { x: 60, y: 10 }, b: { x: 60, y: 59.6 }, source: "test" },
        ],
        expected: [{ x: 60, y: 60 }],
      },
      {
        id: "overlap",
        label: "Colinear overlap",
        segments: [
          { a: { x: 10, y: 40 }, b: { x: 110, y: 40 }, source: "test" },
          { a: { x: 60, y: 40 }, b: { x: 140, y: 40 }, source: "test" },
        ],
        expected: [{ x: 60, y: 40 }, { x: 110, y: 40 }],
      },
      {
        id: "touch",
        label: "Colinear touch",
        segments: [
          { a: { x: 10, y: 90 }, b: { x: 60, y: 90 }, source: "test" },
          { a: { x: 60, y: 90 }, b: { x: 110, y: 90 }, source: "test" },
        ],
        expected: [{ x: 60, y: 90 }],
      },
    ];
    const endpointSnap = 1;

    DerleLogic.setMeasureSvg(document.getElementById("measure"));

    const toggleOriginal = document.getElementById("toggleOriginal");
    const toggleSplit = document.getElementById("toggleSplit");
    const toggleExpected = document.getElementById("toggleExpected");
    const toggleEndpoints = document.getElementById("toggleEndpoints");
    const casesHost = document.getElementById("cases");

    function createSvg(width, height) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      return svg;
    }

    function drawSegments(parent, segments, style) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("stroke", style.stroke);
      group.setAttribute("stroke-width", style.strokeWidth);
      group.setAttribute("fill", "none");
      if (style.dash) {
        group.setAttribute("stroke-dasharray", style.dash);
      }
      segments.forEach((seg) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", seg.a.x);
        line.setAttribute("y1", seg.a.y);
        line.setAttribute("x2", seg.b.x);
        line.setAttribute("y2", seg.b.y);
        group.appendChild(line);
      });
      parent.appendChild(group);
      return group;
    }

    function drawPoints(parent, points, style) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("fill", style.fill);
      points.forEach((pt) => {
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", pt.x);
        circle.setAttribute("cy", pt.y);
        circle.setAttribute("r", style.radius);
        group.appendChild(circle);
      });
      parent.appendChild(group);
      return group;
    }

    function collectEndpoints(segments) {
      const points = [];
      segments.forEach((seg) => {
        points.push(seg.a, seg.b);
      });
      return points;
    }

    function hasPoint(points, target, tol) {
      for (let i = 0; i < points.length; i += 1) {
        const p = points[i];
        if (Math.hypot(p.x - target.x, p.y - target.y) <= tol) {
          return true;
        }
      }
      return false;
    }

    async function renderCases() {
      casesHost.innerHTML = "";
      const gridSize = 20;
      for (let i = 0; i < cases.length; i += 1) {
        const testCase = cases[i];
        const splitSegments = await DerleLogic.splitSegmentsAtIntersections(testCase.segments, gridSize, endpointSnap);
        const endpoints = collectEndpoints(splitSegments);
        const expected = testCase.expected || [];
        const pass = expected.every((pt) => hasPoint(endpoints, pt, 0.6));

        const card = document.createElement("div");
        card.className = "case";
        const header = document.createElement("div");
        header.className = "case-header";
        const title = document.createElement("h2");
        title.className = "case-title";
        title.textContent = testCase.label;
        const badge = document.createElement("span");
        badge.className = `badge ${pass ? "pass" : "fail"}`;
        badge.textContent = pass ? "PASS" : "FAIL";
        header.appendChild(title);
        header.appendChild(badge);
        card.appendChild(header);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `Segments: ${testCase.segments.length} -> ${splitSegments.length}, Expected points: ${expected.length}`;
        card.appendChild(meta);

        const svg = createSvg(160, 120);
        const originalGroup = drawSegments(svg, testCase.segments, {
          stroke: "var(--ghost)",
          strokeWidth: "2",
          dash: "4 4",
        });
        const splitGroup = drawSegments(svg, splitSegments, {
          stroke: "var(--line)",
          strokeWidth: "2.6",
        });
        const expectedGroup = drawPoints(svg, expected, { fill: "var(--danger)", radius: 3.2 });
        const endpointsGroup = drawPoints(svg, endpoints, { fill: "var(--accent)", radius: 1.8 });

        originalGroup.style.display = toggleOriginal.checked ? "inline" : "none";
        splitGroup.style.display = toggleSplit.checked ? "inline" : "none";
        expectedGroup.style.display = toggleExpected.checked ? "inline" : "none";
        endpointsGroup.style.display = toggleEndpoints.checked ? "inline" : "none";

        card.appendChild(svg);
        casesHost.appendChild(card);
      }
    }

    function syncToggles() {
      const cards = casesHost.querySelectorAll("svg");
      cards.forEach((svg) => {
        const groups = svg.querySelectorAll("g");
        if (groups.length < 4) return;
        groups[0].style.display = toggleOriginal.checked ? "inline" : "none";
        groups[1].style.display = toggleSplit.checked ? "inline" : "none";
        groups[2].style.display = toggleExpected.checked ? "inline" : "none";
        groups[3].style.display = toggleEndpoints.checked ? "inline" : "none";
      });
    }

    [toggleOriginal, toggleSplit, toggleExpected, toggleEndpoints].forEach((input) => {
      input.addEventListener("change", syncToggles);
    });

    renderCases();

    // ---- 点列化の新旧比較 ---------------------------------------------------
    //
    // 「旧方式を残したまま、劣化がないことを確かめてから切り替える」ための検証。
    // 同じパスに両方式を掛け、形状のずれ（双方向の最大距離）・点数・時間を出す。
    // 見出しの数値だけでなく、ずれが大きい順にパスを並べて個別に確認できるようにする。

    /** 点 p から線分 ab までの距離。 */
    function pointSegDist(p, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len2 = dx * dx + dy * dy;
      if (len2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
      let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
    }

    /** 点列 pts の各点から折れ線 poly までの距離の最大（片方向のハウスドルフ距離）。 */
    function maxDistToPolyline(pts, poly) {
      if (poly.length < 2) return Infinity;
      // 折れ線の各線分に対する最小距離を取る。パス長が大きいので、直前に最も近かった
      // 区間の周辺から探し始めて全探索を避ける（形が概ね一致している前提の高速化。
      // 一致していなければ距離が大きく出るので、判定の安全側には倒れない）。
      let worst = 0;
      let hint = 0;
      for (let i = 0; i < pts.length; i += 1) {
        let best = Infinity;
        let bestJ = hint;
        const span = 64;
        const from = Math.max(0, hint - span);
        const to = Math.min(poly.length - 2, hint + span);
        for (let j = from; j <= to; j += 1) {
          const d = pointSegDist(pts[i], poly[j], poly[j + 1]);
          if (d < best) { best = d; bestJ = j; }
        }
        // 近傍で見つからない（大きく外れている）場合だけ全探索して正確に測る
        if (best > 1) {
          for (let j = 0; j <= poly.length - 2; j += 1) {
            const d = pointSegDist(pts[i], poly[j], poly[j + 1]);
            if (d < best) { best = d; bestJ = j; }
          }
        }
        hint = bestJ;
        if (best > worst) worst = best;
      }
      return worst;
    }

    async function runSamplingComparison(svgText, options) {
      const opts = options || {};
      const step = Number(opts.step) || 1.2;
      const tol = Number(opts.tol) || 0.05;
      const layerIds = opts.layerIds || ["_国境界", "_州境界", "_第一分高面"];
      const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
      DerleLogic.setCurveTolerance(tol);

      const report = { step, tol, layers: [], worst: [] };
      for (const id of layerIds) {
        const layer = doc.getElementById(id);
        if (!layer) continue;
        const paths = Array.from(layer.querySelectorAll("path"));
        let oldPts = 0;
        let newPts = 0;
        let oldMs = 0;
        let newMs = 0;
        let fallbacks = 0;
        let worstDev = 0;

        for (const pathEl of paths) {
          const subpaths = DerleLogic.splitPathData(pathEl.getAttribute("d") || "");
          for (const sub of subpaths) {
            const t0 = performance.now();
            const a = DerleLogic.samplePathElementByLength(pathEl, step, sub);
            const t1 = performance.now();
            const b = DerleLogic.samplePathElementFromData(pathEl, sub);
            const t2 = performance.now();
            oldMs += t1 - t0;
            newMs += t2 - t1;
            oldPts += a.length;
            if (!b) { fallbacks += 1; continue; }
            newPts += b.length;
            const dev = Math.max(maxDistToPolyline(b, a), maxDistToPolyline(a, b));
            if (dev > worstDev) worstDev = dev;
            report.worst.push({ layer: id, dev, oldN: a.length, newN: b.length });
          }
        }
        report.layers.push({
          id, paths: paths.length, oldPts, newPts, oldMs, newMs, fallbacks, worstDev,
        });
        await DerleLogic.nextFrame();
      }
      report.worst.sort((p, q) => q.dev - p.dev);
      report.worst = report.worst.slice(0, 10);
      return report;
    }
    window.runSamplingComparison = runSamplingComparison;

    const cmpFile = document.getElementById("cmpFile");
    const cmpOut = document.getElementById("cmpOut");
    document.getElementById("cmpRun").addEventListener("click", async () => {
      const file = cmpFile.files && cmpFile.files[0];
      if (!file) { cmpOut.textContent = "SVG を選んでください。"; return; }
      cmpOut.textContent = "比較中…（旧方式は数分かかります）";
      const text = await file.text();
      const r = await runSamplingComparison(text, {
        step: Number(document.getElementById("cmpStep").value),
        tol: Number(document.getElementById("cmpTol").value),
      });
      const lines = [`間引き間隔 ${r.step} / 曲線許容差 ${r.tol}`, ""];
      for (const L of r.layers) {
        lines.push(
          `${L.id}: path ${L.paths} 本`,
          `  旧: ${L.oldPts} 点 / ${(L.oldMs / 1000).toFixed(2)} 秒`,
          `  新: ${L.newPts} 点 / ${(L.newMs / 1000).toFixed(3)} 秒` +
            (L.fallbacks ? `（旧方式へ退避 ${L.fallbacks} 本）` : ""),
          `  倍率: ${(L.oldMs / Math.max(L.newMs, 1e-6)).toFixed(0)} 倍速 / 点数比 ${(L.newPts / Math.max(L.oldPts, 1)).toFixed(2)}`,
          `  形状の最大ずれ: ${L.worstDev.toFixed(4)} 地図単位`,
          ""
        );
      }
      lines.push("ずれが大きいサブパス上位:");
      for (const w of r.worst) {
        lines.push(`  ${w.layer}: ${w.dev.toFixed(4)} （旧 ${w.oldN} 点 → 新 ${w.newN} 点）`);
      }
      cmpOut.textContent = lines.join("\n");
    });
  </script>
</body>
</html>
