<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logic Test</title>
  <style>
    :root {
      --bg: #0f1116;
      --panel: #171a22;
      --panel-border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #6abf69;
      --danger: #e06c75;
      --line: #7aa2f7;
      --ghost: rgba(230, 233, 239, 0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.02);
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .container {
      padding: 16px 20px 24px;
      display: grid;
      gap: 16px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
      font-size: 13px;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cases {
      display: grid;
      gap: 16px;
    }
    .case {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .case-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .case-title {
      font-size: 14px;
      margin: 0;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .badge.pass {
      background: rgba(106, 191, 105, 0.2);
      color: var(--accent);
      border: 1px solid rgba(106, 191, 105, 0.4);
    }
    .badge.fail {
      background: rgba(224, 108, 117, 0.2);
      color: var(--danger);
      border: 1px solid rgba(224, 108, 117, 0.4);
    }
    .meta {
      font-size: 11px;
      color: var(--muted);
    }
    svg {
      width: 100%;
      height: 150px;
      border-radius: 8px;
      background: #0b0f15;
      border: 1px solid var(--panel-border);
    }
  </style>
</head>
<body>
  <header>
    <h1>Logic Test</h1>
    <p>Visual check for segment splitting with overlaps and intersections.</p>
  </header>

  <main class="container">
    <section class="controls">
      <label><input id="toggleOriginal" type="checkbox" checked />Show original segments</label>
      <label><input id="toggleSplit" type="checkbox" checked />Show split segments</label>
      <label><input id="toggleExpected" type="checkbox" checked />Show expected points</label>
      <label><input id="toggleEndpoints" type="checkbox" />Show split endpoints</label>
    </section>
    <section id="cases" class="cases"></section>
    <h2 style="font-size:15px;margin:8px 0 0;">経度180度の継ぎ目（合成SVG）</h2>
    <section id="seamCases" class="cases"></section>
  </main>

  <svg id="measure" width="0" height="0" style="position:absolute; left:-9999px; top:-9999px;"></svg>

  <script src="logic.js"></script>
  <script>
    const cases = [
      {
        id: "cross",
        label: "Crossing (X)",
        segments: [
          { a: { x: 10, y: 10 }, b: { x: 110, y: 110 }, source: "test" },
          { a: { x: 10, y: 110 }, b: { x: 110, y: 10 }, source: "test" },
        ],
        expected: [{ x: 60, y: 60 }],
      },
      {
        id: "tee",
        label: "T junction",
        segments: [
          { a: { x: 10, y: 60 }, b: { x: 110, y: 60 }, source: "test" },
          { a: { x: 60, y: 10 }, b: { x: 60, y: 60 }, source: "test" },
        ],
        expected: [{ x: 60, y: 60 }],
      },
      {
        id: "near-tee",
        label: "Near T junction (snap)",
        segments: [
          { a: { x: 10, y: 60 }, b: { x: 110, y: 60 }, source: "test" },
          { a: { x: 60, y: 10 }, b: { x: 60, y: 59.6 }, source: "test" },
        ],
        expected: [{ x: 60, y: 60 }],
      },
      {
        id: "overlap",
        label: "Colinear overlap",
        segments: [
          { a: { x: 10, y: 40 }, b: { x: 110, y: 40 }, source: "test" },
          { a: { x: 60, y: 40 }, b: { x: 140, y: 40 }, source: "test" },
        ],
        expected: [{ x: 60, y: 40 }, { x: 110, y: 40 }],
      },
      {
        id: "touch",
        label: "Colinear touch",
        segments: [
          { a: { x: 10, y: 90 }, b: { x: 60, y: 90 }, source: "test" },
          { a: { x: 60, y: 90 }, b: { x: 110, y: 90 }, source: "test" },
        ],
        expected: [{ x: 60, y: 90 }],
      },
    ];
    const endpointSnap = 1;

    DerleLogic.setMeasureSvg(document.getElementById("measure"));

    const toggleOriginal = document.getElementById("toggleOriginal");
    const toggleSplit = document.getElementById("toggleSplit");
    const toggleExpected = document.getElementById("toggleExpected");
    const toggleEndpoints = document.getElementById("toggleEndpoints");
    const casesHost = document.getElementById("cases");

    function createSvg(width, height) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      return svg;
    }

    function drawSegments(parent, segments, style) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("stroke", style.stroke);
      group.setAttribute("stroke-width", style.strokeWidth);
      group.setAttribute("fill", "none");
      if (style.dash) {
        group.setAttribute("stroke-dasharray", style.dash);
      }
      segments.forEach((seg) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", seg.a.x);
        line.setAttribute("y1", seg.a.y);
        line.setAttribute("x2", seg.b.x);
        line.setAttribute("y2", seg.b.y);
        group.appendChild(line);
      });
      parent.appendChild(group);
      return group;
    }

    function drawPoints(parent, points, style) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("fill", style.fill);
      points.forEach((pt) => {
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", pt.x);
        circle.setAttribute("cy", pt.y);
        circle.setAttribute("r", style.radius);
        group.appendChild(circle);
      });
      parent.appendChild(group);
      return group;
    }

    function collectEndpoints(segments) {
      const points = [];
      segments.forEach((seg) => {
        points.push(seg.a, seg.b);
      });
      return points;
    }

    function hasPoint(points, target, tol) {
      for (let i = 0; i < points.length; i += 1) {
        const p = points[i];
        if (Math.hypot(p.x - target.x, p.y - target.y) <= tol) {
          return true;
        }
      }
      return false;
    }

    async function renderCases() {
      casesHost.innerHTML = "";
      const gridSize = 20;
      for (let i = 0; i < cases.length; i += 1) {
        const testCase = cases[i];
        const splitSegments = await DerleLogic.splitSegmentsAtIntersections(testCase.segments, gridSize, endpointSnap);
        const endpoints = collectEndpoints(splitSegments);
        const expected = testCase.expected || [];
        const pass = expected.every((pt) => hasPoint(endpoints, pt, 0.6));

        const card = document.createElement("div");
        card.className = "case";
        const header = document.createElement("div");
        header.className = "case-header";
        const title = document.createElement("h2");
        title.className = "case-title";
        title.textContent = testCase.label;
        const badge = document.createElement("span");
        badge.className = `badge ${pass ? "pass" : "fail"}`;
        badge.textContent = pass ? "PASS" : "FAIL";
        header.appendChild(title);
        header.appendChild(badge);
        card.appendChild(header);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `Segments: ${testCase.segments.length} -> ${splitSegments.length}, Expected points: ${expected.length}`;
        card.appendChild(meta);

        const svg = createSvg(160, 120);
        const originalGroup = drawSegments(svg, testCase.segments, {
          stroke: "var(--ghost)",
          strokeWidth: "2",
          dash: "4 4",
        });
        const splitGroup = drawSegments(svg, splitSegments, {
          stroke: "var(--line)",
          strokeWidth: "2.6",
        });
        const expectedGroup = drawPoints(svg, expected, { fill: "var(--danger)", radius: 3.2 });
        const endpointsGroup = drawPoints(svg, endpoints, { fill: "var(--accent)", radius: 1.8 });

        originalGroup.style.display = toggleOriginal.checked ? "inline" : "none";
        splitGroup.style.display = toggleSplit.checked ? "inline" : "none";
        expectedGroup.style.display = toggleExpected.checked ? "inline" : "none";
        endpointsGroup.style.display = toggleEndpoints.checked ? "inline" : "none";

        card.appendChild(svg);
        casesHost.appendChild(card);
      }
    }

    function syncToggles() {
      const cards = casesHost.querySelectorAll("svg");
      cards.forEach((svg) => {
        const groups = svg.querySelectorAll("g");
        if (groups.length < 4) return;
        groups[0].style.display = toggleOriginal.checked ? "inline" : "none";
        groups[1].style.display = toggleSplit.checked ? "inline" : "none";
        groups[2].style.display = toggleExpected.checked ? "inline" : "none";
        groups[3].style.display = toggleEndpoints.checked ? "inline" : "none";
      });
    }

    [toggleOriginal, toggleSplit, toggleExpected, toggleEndpoints].forEach((input) => {
      input.addEventListener("change", syncToggles);
    });

    renderCases();
  </script>
  <script>
    // 経度180度の継ぎ目の合成ケース。地図枠 x=0..400, y=0..200（_海の矩形）。
    // - 島（y20–50）: 陸の切断線で西端・東端に分かれる → 1地物にまとめる
    // - 海上国境（y80–120）: 西端に_国境界の線あり、東端は線なし（枠で閉じる）→ まとめない・国境として描く
    // - 経度180度上の本物の海岸線（西端y140–170、東端は海）→ まとめない・海岸線として描く
    // - 端で2回接するC字の陸（西端y175–180, 190–195）: 枠と海岸線だけで閉じる湾は面にしない
    const SEAM_FIXTURE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 408 208">
      <g id="_海"><rect id="_海色" x="0" y="0" width="400" height="200" /></g>
      <g id="_第一分高面">
        <path d="M0 20 H30 V50 H0 Z" />
        <path d="M370 20 H400 V50 H370 Z" />
        <path d="M0 140 H50 V170 H0 Z" />
        <path d="M0 175 H60 V195 H0 V190 H40 V180 H0 Z" />
      </g>
      <g id="_国境界">
        <path d="M0 80 H40 V120 H0 Z" />
        <path d="M400 80 H360 V120 H400" />
      </g>
    </svg>`;

    async function runSeamCase() {
      const L = DerleLogic;
      const doc = new DOMParser().parseFromString(SEAM_FIXTURE_SVG, "image/svg+xml");
      const rect = doc.getElementById("_海色");
      const frame = {
        x: Number(rect.getAttribute("x")),
        y: Number(rect.getAttribute("y")),
        width: Number(rect.getAttribute("width")),
        height: Number(rect.getAttribute("height")),
      };
      const tol = 0.05;
      const snap = 0.5;
      const step = 1;
      const coast = await L.extractSegmentsFromLayer(doc.getElementById("_第一分高面"), step, "coast");
      const border = await L.extractSegmentsFromLayer(doc.getElementById("_国境界"), step, "border");
      const segments = await L.splitSegmentsAtIntersections(coast.concat(border), 4, snap);
      const graph = await L.buildGraphFromSegments(segments, snap);
      L.snapPointsToSeam(graph.points, frame, tol);
      const frameEdges = L.addSeamFrameEdges(graph, frame, tol);
      const frameEdgesAgain = L.addSeamFrameEdges(graph, frame, tol);
      const faces = L.extractPolygonsFromGraph(graph, 0).polygons;
      const sources = new Map(graph.edges.map((e) => [e.a < e.b ? `${e.a}-${e.b}` : `${e.b}-${e.a}`, e.sources]));
      const getSources = (a, b) => sources.get(a < b ? `${a}-${b}` : `${b}-${a}`);
      const pieces = faces.filter((f) => !L.isFrameOnlySeaFace(f.points, getSources));
      const seam = L.analyzeSeam(graph, frame, tol);
      const grouping = L.groupSeamPolygons(pieces, graph.points, frame, { tol, cut: seam.cut });

      const bbox = (face) => {
        const pts = face.points.map((i) => graph.points[i]);
        return {
          minX: Math.min(...pts.map((p) => p.x)), maxX: Math.max(...pts.map((p) => p.x)),
          minY: Math.min(...pts.map((p) => p.y)), maxY: Math.max(...pts.map((p) => p.y)),
        };
      };
      const near = (a, b) => Math.abs(a - b) < 1.5;
      const findPiece = (minX, maxX, minY, maxY) => pieces.findIndex((f) => {
        const b = bbox(f);
        return near(b.minX, minX) && near(b.maxX, maxX) && near(b.minY, minY) && near(b.maxY, maxY);
      });
      const islandW = findPiece(0, 30, 20, 50);
      const islandE = findPiece(370, 400, 20, 50);
      const seaW = findPiece(0, 40, 80, 120);
      const seaE = findPiece(360, 400, 80, 120);
      const realCoast = findPiece(0, 50, 140, 170);
      const groupOfPiece = (idx) => grouping.groups.find((g) => g.includes(idx)) || null;
      const P = (x, y) => ({ x, y });
      const checks = [
        ["枠の仮想辺を追加し、再実行では増えない（冪等）", frameEdges > 0 && frameEdgesAgain === 0],
        ["島の西・東ピース、海上国境の両ピース、経度180度の海岸線の陸が面になる",
          [islandW, islandE, seaW, seaE, realCoast].every((i) => i >= 0)],
        ["東端に線のない海上国境の面が枠の仮想辺で閉じる", seaE >= 0],
        ["枠と海岸線だけで閉じたC字の湾は面にしない",
          faces.length - pieces.length === 1 && findPiece(0, 40, 180, 190) === -1],
        ["継ぎ目でつながるグループは島の1件だけ", grouping.groups.length === 1
          && groupOfPiece(islandW) && groupOfPiece(islandW).includes(islandE)],
        ["地図端に国境線がある海上国境はまとめない", !groupOfPiece(seaW) && !groupOfPiece(seaE)],
        ["地図端の国境線の区間（y80–120）を国境として扱う",
          seam.borderAny.length === 1 && near(seam.borderAny[0][0], 80) && near(seam.borderAny[0][1], 120)],
        ["島の切断線は人工的（西・東とも）",
          L.isArtificialSeamEdge(P(0, 30), P(0, 31), frame, tol, seam)
          && L.isArtificialSeamEdge(P(400, 30), P(400, 31), frame, tol, seam)],
        ["地図端の国境線は人工的ではない", !L.isArtificialSeamEdge(P(0, 100), P(0, 101), frame, tol, seam)],
        ["経度180度上の本物の海岸線は人工的ではない（描画する）",
          !L.isArtificialSeamEdge(P(0, 150), P(0, 151), frame, tol, seam) && !groupOfPiece(realCoast)],
        ["区間演算: 差・積", JSON.stringify(L.subtractIntervals([[0, 10]], [[2, 3], [5, 6]])) === "[[0,2],[3,5],[6,10]]"
          && JSON.stringify(L.intersectIntervals([[0, 4], [6, 10]], [[3, 7]])) === "[[3,4],[6,7]]"],
        ["重なりが短い方の50%未満の区間はつながない（海上国境が両端で少しずれる場合）", (() => {
          const pts = [P(0, 100), P(0, 300), P(0, 500), P(400, 100), P(400, 310), P(400, 500)];
          const polys = [{ points: [0, 1] }, { points: [1, 2] }, { points: [3, 4] }, { points: [4, 5] }];
          const r = L.groupSeamPolygons(polys, pts, { x: 0, y: 0, width: 400, height: 2000 }, { tol });
          return r.groups.length === 2
            && r.groups.some((g) => g.includes(0) && g.includes(2))
            && r.groups.some((g) => g.includes(1) && g.includes(3));
        })()],
      ];
      window.seamTestResults = checks.map(([label, ok]) => ({ label, ok: !!ok }));

      const host = document.getElementById("seamCases");
      host.innerHTML = "";
      const card = document.createElement("div");
      card.className = "case";
      const allOk = checks.every(([, ok]) => ok);
      card.innerHTML = `<div class="case-header"><h2 class="case-title">島・海上国境・本物の海岸線</h2>`
        + `<span class="badge ${allOk ? "pass" : "fail"}">${allOk ? "PASS" : "FAIL"}</span></div>`
        + `<div class="meta">面 ${faces.length} → ピース ${pieces.length}、グループ ${grouping.groups.length}、枠の仮想辺 ${frameEdges}本</div>`;
      const list = document.createElement("ul");
      list.className = "meta";
      checks.forEach(([label, ok]) => {
        const li = document.createElement("li");
        li.textContent = `${ok ? "PASS" : "FAIL"}: ${label}`;
        li.style.color = ok ? "var(--accent)" : "var(--danger)";
        list.appendChild(li);
      });
      card.appendChild(list);
      const svg = createSvg(408, 208);
      svg.setAttribute("viewBox", "-4 -4 408 208");
      svg.style.height = "220px";
      const lines = (pred) => graph.edges.filter(pred).map((e) => ({ a: graph.points[e.a], b: graph.points[e.b] }));
      const artificial = (e) => L.isArtificialSeamEdge(graph.points[e.a], graph.points[e.b], frame, tol, seam);
      drawSegments(svg, lines((e) => e.sources.has("frame") && e.sources.size === 1), { stroke: "var(--ghost)", strokeWidth: "1", dash: "3 3" });
      drawSegments(svg, lines((e) => e.sources.has("coast") && !artificial(e)), { stroke: "var(--accent)", strokeWidth: "1.5" });
      drawSegments(svg, lines((e) => e.sources.has("border")), { stroke: "var(--line)", strokeWidth: "1.5" });
      drawSegments(svg, lines((e) => e.sources.has("coast") && artificial(e)), { stroke: "var(--danger)", strokeWidth: "2", dash: "2 2" });
      card.appendChild(svg);
      const legend = document.createElement("div");
      legend.className = "meta";
      legend.textContent = "緑: 海岸線 / 青: 国境線 / 赤破線: 人工的な切断線（球面では描かない）/ 灰破線: 枠の仮想辺";
      card.appendChild(legend);
      host.appendChild(card);
    }

    runSeamCase().catch((error) => {
      window.seamTestResults = [{ label: `例外: ${error.message}`, ok: false }];
      document.getElementById("seamCases").textContent = `FAIL: ${error.message}`;
    });
  </script>
</body>
</html>
